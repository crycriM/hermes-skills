# Aqfinea.net .htaccess — Apache redirect & security rules
# Upload to: sites/aqfinea.net/.htaccess
# Purpose: Collapse all URL variants to https://aqfinea.net/ for SEO

# ── Force HTTPS + canonical domain ──
RewriteEngine On

# Redirect HTTP → HTTPS
RewriteCond %{HTTPS} off
RewriteRule ^(.*)$ https://aqfinea.net/$1 [R=301,L]

# Redirect www → non-www
RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
RewriteRule ^(.*)$ https://aqfinea.net/$1 [R=301,L]

# Redirect /index.html → /
RewriteRule ^index\.html$ / [R=301,L]

# ── Kill WordPress URL space (dormant WP removal) ──
# Block all wp-*.php entry points → redirect to homepage
RewriteRule ^wp-login\.php$ / [R=301,L]
RewriteRule ^wp-admin(/.*)?$ / [R=301,L]
RewriteRule ^wp-signup\.php$ / [R=301,L]
RewriteRule ^wp-activate\.php$ / [R=301,L]
RewriteRule ^wp-trackback\.php$ / [R=301,L]
RewriteRule ^wp-mail\.php$ / [R=301,L]
RewriteRule ^wp-links-opml\.php$ / [R=301,L]
RewriteRule ^wp-cron\.php$ / [R=301,L]
RewriteRule ^xmlrpc\.php$ / [R=301,L]

# Block /?p= query string (WP permalink)
RewriteCond %{QUERY_STRING} ^p=[0-9]+
RewriteRule ^$ /? [R=301,L]

# ── Security headers ──
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ── Cache static assets ──
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType text/css "access plus 1 week"
  ExpiresByType application/javascript "access plus 1 week"
</IfModule>
