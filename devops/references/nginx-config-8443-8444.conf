# Pelemello Reverse Proxy — HTTPS for LAN access
# File: ~/projects/pelemello/reverse-proxy/nginx.conf
# Symlink to: /etc/nginx/sites-enabled/pelemello

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Port 8443 — Open-WebUI at root ──────────────────────────────────
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /home/cricri/projects/pelemello/reverse-proxy/certs/cert.pem;
    ssl_certificate_key /home/cricri/projects/pelemello/reverse-proxy/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ─── Port 8444 — Services Portal ─────────────────────────────────────
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name _;

    ssl_certificate     /home/cricri/projects/pelemello/reverse-proxy/certs/cert.pem;
    ssl_certificate_key /home/cricri/projects/pelemello/reverse-proxy/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # ─── Root — service listing page ────────────────────────────────
    location = / {
        root /var/www/services;
        try_files /services.html =404;
    }

    # ─── Dashboard ───────────────────────────────────────────────────
    location /dashboard/ {
        proxy_pass http://127.0.0.1:9119/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dashboard;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Llama.cpp Server ────────────────────────────────────────────
    location /llama/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── RAG API ─────────────────────────────────────────────────────
    location /rag/ {
        rewrite ^/rag(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Pelemello ───────────────────────────────────────────────────
    location /pelemello/ {
        rewrite ^/pelemello(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect /static/ /pelemello/static/;

        sub_filter_once off;
        sub_filter_types text/javascript;
        sub_filter 'href="/static/' 'href="/pelemello/static/';
        sub_filter 'src="/static/' 'src="/pelemello/static/';
        sub_filter 'const API = "/api"' 'const API = "/pelemello/api"';
        sub_filter '"/api/' '"/pelemello/api/';
        sub_filter "'/api/" "'/pelemello/api/";
    }

    # ─── Model Manager API ───────────────────────────────────────────
    location /v1/ {
        proxy_pass http://127.0.0.1:8079/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Model Manager GUI ───────────────────────────────────────────
    location /model-manager/ {
        rewrite ^/model-manager(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Whisper STT ─────────────────────────────────────────────────
    location /whisper/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
